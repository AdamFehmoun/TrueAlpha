name: Mutation audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  mutation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Mutation audit --check (README table must match measured kills, byte-for-byte)
        run: python -m scripts.mutation_audit --check
