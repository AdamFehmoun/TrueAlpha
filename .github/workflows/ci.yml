name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy --strict)
        run: mypy

      - name: Tests (incl. data reproducibility, anti-leakage, buy&hold identity)
        run: pytest

      - name: README sync check (no hand-written numbers)
        run: python -m scripts.generate_results --check
